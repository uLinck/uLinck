name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
          
      # computes current + longest contribution streak via the GraphQL API and renders a
      # static SVG card, so the README streak card never depends on a third-party render service
      - name: generate streak.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{contributionCount}}}}}}","variables":{"login":"${{ github.repository_owner }}"}}' \
            https://api.github.com/graphql > contributions.json

          python3 <<'PYEOF'
          import json

          with open("contributions.json") as f:
              data = json.load(f)

          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
          days = [d["contributionCount"] for w in weeks for d in w["contributionDays"]]

          i = len(days) - 1
          if days[i] == 0:
              i -= 1  # today may not have contributions yet, don't break the streak on it

          current = 0
          while i >= 0 and days[i] > 0:
              current += 1
              i -= 1

          longest = run = 0
          for count in days:
              run = run + 1 if count > 0 else 0
              longest = max(longest, run)

          svg = f'''<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#120022"/>
                <stop offset="100%" stop-color="#2d0140"/>
              </linearGradient>
              <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7b2ff7"/>
                <stop offset="100%" stop-color="#ff00f6"/>
              </linearGradient>
              <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff00f6" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#ff00f6" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect x="1" y="1" width="418" height="198" rx="16" fill="url(#bg)" stroke="url(#ring)" stroke-width="2"/>
            <circle cx="145" cy="100" r="62" fill="url(#glow)"/>
            <circle cx="145" cy="100" r="52" fill="#1a0430" stroke="url(#ring)" stroke-width="6"/>
            <text x="145" y="96" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="36" font-weight="800" fill="#ffffff">{current}</text>
            <text x="145" y="118" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12" fill="#d9b3ef">days</text>
            <text x="145" y="178" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ff8cf5">CURRENT STREAK</text>
            <line x1="235" y1="45" x2="235" y2="160" stroke="#4a1a63" stroke-width="1.5"/>
            <text x="325" y="90" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="36" font-weight="800" fill="#ffffff">{longest}</text>
            <text x="325" y="112" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12" fill="#d9b3ef">days</text>
            <text x="325" y="150" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ff8cf5">LONGEST STREAK</text>
          </svg>'''

          with open("dist/streak.svg", "w") as f:
              f.write(svg)
          PYEOF

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
